<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>لوحة التحكم الشخصية | Life Dashboard</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eeeefd',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .tab-btn.active {
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
        }
        .dark .tab-btn.active {
            color: #818cf8;
            border-bottom: 2px solid #818cf8;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    ⚡
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">لوحة التحكم الشخصية</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400" id="current-date">جاري التحميل...</p>
                </div>
            </div>

            <!-- Light/Dark Mode Toggle & Install Button -->
            <div class="flex items-center gap-2">
                <button id="install-btn" class="hidden text-xs bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-100 dark:hover:bg-indigo-900/50 transition">
                    📲 تثبيت
                </button>
                <button id="theme-toggle" class="p-2 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition" aria-label="تبديل الوضع">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="max-w-4xl mx-auto px-4 flex border-t border-gray-100 dark:border-gray-700/50">
            <button onclick="switchTab('tasks')" id="tab-tasks" class="tab-btn active flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-indigo-600 transition text-center">
                📋 المهام اليومية
            </button>
            <button onclick="switchTab('habits')" id="tab-habits" class="tab-btn flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-indigo-600 transition text-center">
                🔥 تتبع العادات
            </button>
            <button onclick="switchTab('brain-dump')" id="tab-brain-dump" class="tab-btn flex-1 py-3 text-sm font-semibold text-gray-500 hover:text-indigo-600 transition text-center">
                💡 إفراغ العقل
            </button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- TAB 1: DAILY TASKS -->
        <section id="sec-tasks" class="space-y-6">
            <!-- Add Task Form -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
                <div class="flex flex-col md:flex-row gap-2">
                    <input type="text" id="task-input" placeholder="ما هي المهمة التي تريد إنجازها؟" class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div class="flex gap-2">
                        <select id="task-category" class="bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="دراسة">📚 دراسة</option>
                            <option value="عمل">💼 عمل</option>
                            <option value="شخصي">👤 شخصي</option>
                            <option value="صحة">💪 صحة</option>
                        </select>
                        <select id="task-target-day" class="bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="today">اليوم</option>
                            <option value="tomorrow">الغد 🌙</option>
                        </select>
                    </div>
                </div>
                <button onclick="addTask()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                    إضافة المهمة ✨
                </button>
            </div>

            <!-- Today's Tasks List -->
            <div class="space-y-3">
                <h2 class="text-base font-bold flex items-center justify-between text-gray-700 dark:text-gray-300">
                    <span>مهام اليوم</span>
                    <span id="tasks-progress" class="text-xs bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 px-2.5 py-1 rounded-full font-bold">0 / 0</span>
                </h2>
                <div id="today-tasks-list" class="space-y-2">
                    <!-- Dynamic Items -->
                </div>
            </div>

            <!-- Tomorrow's Tasks List -->
            <div class="space-y-3 pt-4 border-t border-gray-200 dark:border-gray-800">
                <h2 class="text-base font-bold text-gray-700 dark:text-gray-300">خطة الغد 🌙</h2>
                <div id="tomorrow-tasks-list" class="space-y-2">
                    <!-- Dynamic Items -->
                </div>
            </div>
        </section>

        <!-- TAB 2: HABIT TRACKER -->
        <section id="sec-habits" class="hidden space-y-6">
            <!-- Add Habit Form -->
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex gap-2">
                <input type="text" id="habit-input" placeholder="أضف عادة جديدة (مثال: قراءة 10 صفحات، رياضة...)" class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addHabit()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow-sm whitespace-nowrap">
                    إضافة عادة
                </button>
            </div>

            <!-- Habits List -->
            <div id="habits-list" class="space-y-3">
                <!-- Dynamic Items -->
            </div>
        </section>

        <!-- TAB 3: BRAIN DUMP -->
        <section id="sec-brain-dump" class="hidden space-y-6">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
                <textarea id="brain-dump-input" rows="3" placeholder="أفرغ أفكارك العشوائية هنا فوراً... لا تحبس فكرة في عقلك!" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                <button onclick="addBrainDumpNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                    حفظ الملاحظة السريعة 💡
                </button>
            </div>

            <!-- Notes List -->
            <div class="space-y-3">
                <h2 class="text-base font-bold text-gray-700 dark:text-gray-300">الملاحظات والأفكار السريعة</h2>
                <div id="brain-dump-list" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- Dynamic Items -->
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        // State Management
        let appState = {
            tasks: [],
            habits: [],
            notes: [],
            darkMode: false
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            setupDate();
            setupTheme();
            renderAll();
            registerServiceWorker();
        });

        function loadState() {
            const saved = localStorage.getItem('life_dashboard_data');
            if (saved) {
                try { appState = JSON.parse(saved); } catch(e) {}
            }
        }

        function saveState() {
            localStorage.setItem('life_dashboard_data', JSON.stringify(appState));
            renderAll();
        }

        function setupDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('ar-EG', options);
        }

        // Dark Mode Logic
        function setupTheme() {
            const isDark = appState.darkMode || window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(isDark);

            document.getElementById('theme-toggle').addEventListener('click', () => {
                setTheme(!document.documentElement.classList.contains('dark'));
            });
        }

        function setTheme(isDark) {
            appState.darkMode = isDark;
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').textContent = '🌙';
            }
            localStorage.setItem('life_dashboard_data', JSON.stringify(appState));
        }

        // Tab Switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`sec-${tabName}`).classList.remove('hidden');
        }

        // Render Functions
        function renderAll() {
            renderTasks();
            renderHabits();
            renderBrainDump();
        }

        // TASKS LOGIC
        function addTask() {
            const input = document.getElementById('task-input');
            const category = document.getElementById('task-category').value;
            const targetDay = document.getElementById('task-target-day').value;

            if (!input.value.trim()) return;

            appState.tasks.push({
                id: Date.now(),
                text: input.value.trim(),
                category: category,
                targetDay: targetDay, // 'today' or 'tomorrow'
                completed: false
            });

            input.value = '';
            saveState();
        }

        function toggleTask(id) {
            const task = appState.tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveState();
            }
        }

        function deleteTask(id) {
            appState.tasks = appState.tasks.filter(t => t.id !== id);
            saveState();
        }

        function renderTasks() {
            const todayList = document.getElementById('today-tasks-list');
            const tomorrowList = document.getElementById('tomorrow-tasks-list');

            const todayTasks = appState.tasks.filter(t => t.targetDay === 'today');
            const tomorrowTasks = appState.tasks.filter(t => t.targetDay === 'tomorrow');

            // Render Today Tasks
            if (todayTasks.length === 0) {
                todayList.innerHTML = `<p class="text-xs text-gray-400 py-3 text-center">لا توجد مهام مضافة لليوم</p>`;
            } else {
                todayList.innerHTML = todayTasks.map(t => `
                    <div class="flex items-center justify-between p-3 bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700/60 shadow-sm transition">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" class="w-5 h-5 accent-indigo-600 rounded cursor-pointer">
                            <span class="${t.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-800 dark:text-gray-200'} text-sm font-medium">${escapeHtml(t.text)}</span>
                            <span class="text-[10px] bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md font-semibold">${t.category}</span>
                        </div>
                        <button onclick="deleteTask(${t.id})" class="text-gray-400 hover:text-red-500 transition text-sm">✕</button>
                    </div>
                `).join('');
            }

            // Render Tomorrow Tasks
            if (tomorrowTasks.length === 0) {
                tomorrowList.innerHTML = `<p class="text-xs text-gray-400 py-3 text-center">لا توجد مهام مجدولة للغد</p>`;
            } else {
                tomorrowList.innerHTML = tomorrowTasks.map(t => `
                    <div class="flex items-center justify-between p-3 bg-white/70 dark:bg-gray-800/70 rounded-xl border border-gray-100 dark:border-gray-700/40">
                        <div class="flex items-center gap-3">
                            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">${escapeHtml(t.text)}</span>
                            <span class="text-[10px] bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md font-semibold">${t.category}</span>
                        </div>
                        <button onclick="deleteTask(${t.id})" class="text-gray-400 hover:text-red-500 transition text-sm">✕</button>
                    </div>
                `).join('');
            }

            // Progress Tracker
            const completedCount = todayTasks.filter(t => t.completed).length;
            document.getElementById('tasks-progress').textContent = `${completedCount} / ${todayTasks.length}`;
        }

        // HABITS LOGIC
        function addHabit() {
            const input = document.getElementById('habit-input');
            if (!input.value.trim()) return;

            const todayKey = new Date().toISOString().split('T')[0];

            appState.habits.push({
                id: Date.now(),
                name: input.value.trim(),
                streak: 0,
                lastCompleted: null
            });

            input.value = '';
            saveState();
        }

        function toggleHabitToday(id) {
            const habit = appState.habits.find(h => h.id === id);
            if (!habit) return;

            const todayKey = new Date().toISOString().split('T')[0];

            if (habit.lastCompleted === todayKey) {
                habit.lastCompleted = null;
                habit.streak = Math.max(0, habit.streak - 1);
            } else {
                habit.lastCompleted = todayKey;
                habit.streak += 1;
            }

            saveState();
        }

        function deleteHabit(id) {
            appState.habits = appState.habits.filter(h => h.id !== id);
            saveState();
        }

        function renderHabits() {
            const list = document.getElementById('habits-list');
            const todayKey = new Date().toISOString().split('T')[0];

            if (appState.habits.length === 0) {
                list.innerHTML = `<p class="text-xs text-gray-400 py-6 text-center">لا توجد عادات مضافة بعد. أضف عاداتك اليومية للالتزام بها!</p>`;
                return;
            }

            list.innerHTML = appState.habits.map(h => {
                const isDoneToday = h.lastCompleted === todayKey;
                return `
                    <div class="flex items-center justify-between p-4 bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700 shadow-sm">
                        <div class="flex items-center gap-3">
                            <button onclick="toggleHabitToday(${h.id})" class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-lg transition ${isDoneToday ? 'bg-green-500 text-white shadow-md shadow-green-500/20' : 'bg-gray-100 dark:bg-gray-700 text-gray-400'}">
                                ${isDoneToday ? '✓' : ''}
                            </button>
                            <div>
                                <h3 class="font-bold text-sm text-gray-800 dark:text-gray-100">${escapeHtml(h.name)}</h3>
                                <p class="text-xs text-orange-5-00 font-semibold flex items-center gap-1">
                                    <span>🔥 متتاليات الأيام (Streak):</span>
                                    <span class="font-bold text-indigo-600 dark:text-indigo-400">${h.streak} أيام</span>
                                </p>
                            </div>
                        </div>
                        <button onclick="deleteHabit(${h.id})" class="text-gray-400 hover:text-red-500 transition text-sm">✕</button>
                    </div>
                `;
            }).join('');
        }

        // BRAIN DUMP LOGIC
        function addBrainDumpNote() {
            const input = document.getElementById('brain-dump-input');
            if (!input.value.trim()) return;

            appState.notes.push({
                id: Date.now(),
                text: input.value.trim(),
                createdAt: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
            });

            input.value = '';
            saveState();
        }

        function convertNoteToTask(id) {
            const note = appState.notes.find(n => n.id === id);
            if (!note) return;

            appState.tasks.push({
                id: Date.now(),
                text: note.text,
                category: 'شخصي',
                targetDay: 'today',
                completed: false
            });

            // Delete note after converting
            appState.notes = appState.notes.filter(n => n.id !== id);
            saveState();
            switchTab('tasks');
        }

        function deleteNote(id) {
            appState.notes = appState.notes.filter(n => n.id !== id);
            saveState();
        }

        function renderBrainDump() {
            const list = document.getElementById('brain-dump-list');

            if (appState.notes.length === 0) {
                list.innerHTML = `<div class="col-span-full text-xs text-gray-400 py-6 text-center">صندوق الأفكار فارغ. دون أي فكرة عشوائية فوراً هنا!</div>`;
                return;
            }

            list.innerHTML = appState.notes.map(n => `
                <div class="p-4 bg-amber-50/50 dark:bg-gray-800 rounded-2xl border border-amber-200/60 dark:border-gray-700/60 shadow-sm flex flex-col justify-between space-y-3">
                    <p class="text-sm text-gray-800 dark:text-gray-200 whitespace-pre-wrap">${escapeHtml(n.text)}</p>
                    <div class="flex items-center justify-between border-t border-amber-200/40 dark:border-gray-700/40 pt-2">
                        <span class="text-[10px] text-gray-400">${n.createdAt}</span>
                        <div class="flex gap-2">
                            <button onclick="convertNoteToTask(${n.id})" class="text-xs bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-2.5 py-1 rounded-lg font-semibold hover:bg-indigo-100 transition">
                                ➔ تحويل لمهمة
                            </button>
                            <button onclick="deleteNote(${n.id})" class="text-gray-400 hover:text-red-500 transition text-xs px-1">✕</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Helper Utility
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        // PWA Registration & Deferred Install Prompt
        let deferredPrompt;
        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('Service Worker Registered'))
                    .catch(err => console.log('SW Registration Failed:', err));
            }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                const installBtn = document.getElementById('install-btn');
                installBtn.classList.remove('hidden');

                installBtn.addEventListener('click', () => {
                    installBtn.classList.add('hidden');
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
                });
            });
        }
    </script>
</body>
</html>
